services:
  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py makemigrations news ai analytics --noinput && python manage.py migrate --noinput && python manage.py fetch_external_news && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    environment:
      - FRONTEND_INTERNAL_URL=http://frontend:4173
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8005:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 60s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    command: sh -c "npm install && npm run build && npm run preview"
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_SITE_URL=https://fxlfm.com
    restart: always
    ports:
      - "5174:4173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4173"]
      interval: 60s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  celery:
    build:
      context: ./backend
    command: celery -A config worker -l info
    env_file:
      - .env
    restart: always
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ./backend
    command: celery -A config beat -l info
    env_file:
      - .env
    restart: always
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
